<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save The Date — Ansaf & Fathima (Nikah)</title>
<style>
  :root {
    --navy: #2c4a5e;
    --navy-dark: #1f3644;
    --cream: #f7f4ee;
    --gold: #c9a86a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(160deg, #eef2f4 0%, #dfe6ea 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--cream);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(31,54,68,0.25);
    max-width: 460px;
    width: 100%;
    overflow: hidden;
  }
  .poster-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1145/1512;
    background: var(--navy-dark);
  }
  .poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .panel {
    padding: 22px 24px 26px;
    text-align: center;
  }
  .bismillah {
    font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
    font-size: 1.15rem;
    color: var(--gold);
    margin: 4px 0 2px;
    direction: rtl;
  }
  .bismillah-en {
    font-size: 0.68rem;
    color: #93a2a9;
    font-style: italic;
    margin: 0 0 10px;
  }
  .crescent {
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .dua {
    font-family: 'Traditional Arabic', 'Amiri', 'Scheherazade New', serif;
    font-size: 0.95rem;
    color: var(--navy-dark);
    direction: rtl;
    margin: 14px 0 3px;
  }
  .dua-en {
    font-size: 0.75rem;
    color: #6b7d87;
    font-style: italic;
    margin: 0 0 18px;
  }
  .panel h1 {
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    color: var(--navy-dark);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .panel p.sub {
    color: #6b7d87;
    font-size: 0.85rem;
    margin: 0 0 18px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 6px;
    border-radius: 999px;
    border: 1.5px solid #dbe2e5;
    background: #fff;
    color: #6b7d87;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .tab-btn.active {
    background: var(--navy-dark);
    border-color: var(--navy-dark);
    color: #fff;
  }
  .msg-box {
    text-align: left;
    background: #fff;
    border: 1px solid #e2e6e8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.85rem;
    color: #3a4a52;
    line-height: 1.5;
    margin-bottom: 18px;
    max-height: 130px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Georgia', serif;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 18px;
    border-radius: 999px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-whatsapp {
    background: #25D366;
    color: #fff;
    box-shadow: 0 6px 16px rgba(37,211,102,0.35);
  }
  .btn-download {
    background: transparent;
    color: var(--navy-dark);
    border: 1.5px solid var(--navy-dark);
  }
  .btn-location {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 6px 16px rgba(44,74,94,0.3);
  }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .hint {
    font-size: 0.72rem;
    color: #93a2a9;
    margin-top: 12px;
    line-height: 1.4;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-dark);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.82rem;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    font-family: sans-serif;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
